name: personal-portfolio

services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-portfolio:latest
    container_name: portfolio-web
    environment:
      # The seeded admin password must come from the host environment —
      # never from a file committed to the repository.
      - PORTFOLIO_ADMIN_PASSWORD=${PORTFOLIO_ADMIN_PASSWORD:?PORTFOLIO_ADMIN_PASSWORD is required to seed the admin account}
      # SQL Server in a container only supports SQL auth (no trusted connection).
      - ConnectionStrings__DefaultConnection=Server=portfolio-db,1433;Database=PortfolioDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "${PORTFOLIO_WEB_PORT:-8080}:8080"
    depends_on:
      portfolio-db:
        condition: service_healthy
    restart: unless-stopped

  portfolio-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: portfolio-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required for the SQL Server container}
      - MSSQL_PID=Developer
    ports:
      # Bound to localhost only — the DB is not meant to be reachable from the network.
      - "127.0.0.1:1433:1433"
    volumes:
      - portfolio-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  portfolio-db-data:
